name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++-14 \
            gcc-14 \
            libasound2-dev \
            libgl1-mesa-dev \
            libssl-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libx11-dev

      - name: Configure
        run: >-
          cmake --preset x64-relwithdebinfo
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build out/x64-relwithdebinfo --parallel 2

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: SLGameLoggerDisplay-linux
          path: |
            out/x64-relwithdebinfo/SLGameLoggerDisplay
            out/x64-relwithdebinfo/Resources/
          if-no-files-found: error

  windows-mingw:
    name: Windows (MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl

      - name: Configure
        run: |
          cmake -S . -B out/windows-mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DOPENSSL_ROOT_DIR="$(cygpath -m "$MSYSTEM_PREFIX")"

      - name: Build
        run: cmake --build out/windows-mingw --parallel 2

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SLGameLoggerDisplay-windows-mingw
          path: |
            out/windows-mingw/SLGameLoggerDisplay.exe
            out/windows-mingw/*.dll
            out/windows-mingw/Resources/
          if-no-files-found: error
